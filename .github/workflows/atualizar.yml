name: Atualizar dados GRAM

on:
  schedule:
    # Todo dia às 01:20 UTC (22:20 em Brasília), depois do fechamento do candle diário
    - cron: "20 1 * * *"
  push:
    # Ao editar a página ou o script, regenera o gram_offline.html.
    # (Commits feitos pelo próprio workflow não disparam nova execução.)
    branches: [main]
    paths:
      - index.html
      - atualizar_gram.py
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-gram
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # O script só usa a biblioteca padrão; o Python 3.12 da imagem ubuntu-24.04 basta,
      # sem precisar da action setup-python.
      - name: Baixar candles novos
        run: python3 atualizar_gram.py --offline

      - name: Commit e push (só se houver mudança)
        run: |
          if git diff --quiet; then
            echo "Sem novidades."
            echo "Sem novidades — nenhum arquivo alterado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ULTIMO=$(python3 -c "import json,re;s=open('dados/gram_1d.js',encoding='utf-8').read();print(json.loads(re.search(r'GRAM_META=(\{.*?\});',s).group(1))['ultimo'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dados/gram_1d.csv dados/gram_1d.js gram_offline.html
          git commit -m "Dados GRAM até ${ULTIMO}"
          # Se houve outro push enquanto o job rodava, reaplica o commit por cima
          git pull --rebase --quiet origin main
          git push
          echo "Dados atualizados até **${ULTIMO}**." >> "$GITHUB_STEP_SUMMARY"
